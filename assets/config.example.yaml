providers:
  # Known providers (see known_providers.rs) only need an api_key — their
  # base_url and discovery kind are built into the binary, so this whole
  # file is short enough to share with a teammate as-is. Any field you set
  # explicitly (base_url, kind, api_key) overrides the built-in default;
  # models: is just a fallback shown before live discovery replaces it.
  openrouter:
    api_key: sk-or-REPLACE_ME

  groq:
    api_key: gsk_REPLACE_ME

  # LM Studio and Ollama don't check the API key at all, so they need
  # nothing beyond the provider name — `{}` is an empty YAML mapping.
  lmstudio: {}
  ollama: {}

# Not every provider is built in — anything else needs its own full block:
# base_url, api_key, and models: (or `kind:` to reuse LM Studio's/Ollama's
# discovery strategy against a compatible server).
#   glm:
#     base_url: https://open.bigmodel.cn/api/paas/v4
#     api_key: REPLACE_ME
#     models:
#       - glm-4.6

# `base_url` must NOT include a trailing /v1 — claude appends /v1/messages
# itself.

# Optional: tell Claude Code the real context window for a model it doesn't
# recognize, so auto-compact doesn't kick in early (it otherwise assumes
# 200k tokens for unknown models). Only needed as a fallback — OpenRouter and
# LM Studio (kind: lmstudio) already report this automatically via discovery.
# Keyed by the exact model name.
#   deepseek:
#     base_url: https://api.deepseek.com
#     api_key: sk-REPLACE_ME
#     models:
#       - deepseek-v4-flash-0731
#     context_windows:
#       deepseek-v4-flash-0731: 1000000
