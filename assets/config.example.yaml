providers:
  openrouter:
    base_url: https://openrouter.ai/api
    api_key: sk-or-REPLACE_ME
    models:
      - anthropic/claude-sonnet-4-6
      - deepseek/deepseek-chat-v3-0324
      - meta-llama/llama-3.1-8b-instruct
      - mistralai/mistral-7b-instruct

  groq:
    base_url: https://api.groq.com/openai
    api_key: gsk_REPLACE_ME
    models:
      - llama-3.1-8b-instant
      - mixtral-8x7b-32768

  lmstudio:
    base_url: http://localhost:1234 # no trailing /v1 — claude appends /v1/messages itself
    api_key: lm-studio
    models:
      - local-model # replace with the model identifier loaded in LM Studio

  ollama:
    base_url: http://localhost:11434 # no trailing /v1 — claude appends /v1/messages itself
    api_key: ollama
    models:
      - llama3.1 # replace with the model identifier pulled in Ollama
