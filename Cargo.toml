[package]
name = "claude-code-swapper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-code-swapper"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
indexmap = { version = "2.14.0", features = ["serde"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
ureq = { version = "2.10", features = ["json"] }
which = "8.0.5"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
