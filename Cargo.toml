[package]
name = "claude-code-swapper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-code-swapper"
path = "src/main.rs"

[dependencies]
dirs = "6.0.0"
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
which = "8.0.5"

[dev-dependencies]
tempfile = "3.27.0"
